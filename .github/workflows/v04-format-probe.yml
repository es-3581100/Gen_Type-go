name: v0.4 temporary formatting probe
on:
  push:
    branches:
      - feat/graph-inspection-v0.4
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format ephemeral checkout and report formatted source
        shell: bash
        run: |
          gofmt -w cmd/gen-type-go/main.go cmd/gen-type-go/main_test.go cmd/gen-type-go/inspection.go cmd/gen-type-go/inspection_test.go internal/graphinspect/inspect.go internal/graphinspect/inspect_test.go internal/graphdiagnostics/diagnose.go internal/graphdiagnostics/diagnose_test.go
          for file in cmd/gen-type-go/main.go cmd/gen-type-go/main_test.go cmd/gen-type-go/inspection.go cmd/gen-type-go/inspection_test.go internal/graphinspect/inspect.go internal/graphinspect/inspect_test.go internal/graphdiagnostics/diagnose.go internal/graphdiagnostics/diagnose_test.go; do
            printf 'GTGFMTBEGIN:%s\n' "$file"
            base64 -w 100 "$file"
            printf '\nGTGFMTEND:%s\n' "$file"
          done
      - name: Verify Go packages on formatted working copy
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOWORK: "off"
        run: |
          go test -count=1 ./...
          go vet ./...
