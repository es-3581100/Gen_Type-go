name: Phase A (read-only) Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Standard library only; no external Go module resolution
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod verify
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 ./...
          go build ./...
          go run ./cmd/gen-type-go validate testdata/tiny_graph.json
          go run ./cmd/gen-type-go roundtrip testdata/tiny_graph.json
          go run ./cmd/gen-type-go sha256 testdata/tiny_graph.json > "$RUNNER_TEMP/first-sha"
          go run ./cmd/gen-type-go sha256 testdata/tiny_graph.json > "$RUNNER_TEMP/second-sha"
          cmp "$RUNNER_TEMP/first-sha" "$RUNNER_TEMP/second-sha"
          if go run ./cmd/gen-type-go validate testdata/invalid_cycle.json; then
            echo 'invalid cycle unexpectedly accepted' >&2; exit 1
          fi
          # Deterministic read-only v0.2 graph diff smoke checks.
          go run ./cmd/gen-type-go diff testdata/tiny_graph.json testdata/diff_after.json > "$RUNNER_TEMP/diff-one.json"
          go run ./cmd/gen-type-go diff testdata/tiny_graph.json testdata/diff_after.json > "$RUNNER_TEMP/diff-two.json"
          cmp "$RUNNER_TEMP/diff-one.json" "$RUNNER_TEMP/diff-two.json"
          go run ./cmd/gen-type-go diff --summary testdata/tiny_graph.json testdata/diff_after.json > "$RUNNER_TEMP/diff-summary.txt"
          grep -q 'Added nodes: 1' "$RUNNER_TEMP/diff-summary.txt"
          if go run ./cmd/gen-type-go diff testdata/tiny_graph.json testdata/invalid_cycle.json > "$RUNNER_TEMP/diff-invalid.json"; then
            echo 'invalid graph unexpectedly diffed' >&2; exit 1
          fi
          test ! -s "$RUNNER_TEMP/diff-invalid.json"
          # Deterministic, non-authoritative v0.3 graph stats smoke checks.
          go run ./cmd/gen-type-go stats testdata/stats_forest.json > "$RUNNER_TEMP/stats-one.json"
          go run ./cmd/gen-type-go stats testdata/stats_forest.json > "$RUNNER_TEMP/stats-two.json"
          cmp "$RUNNER_TEMP/stats-one.json" "$RUNNER_TEMP/stats-two.json"
          grep -q '"node_count":7' "$RUNNER_TEMP/stats-one.json"
          grep -q '"weak_component_sizes":\[6,1\]' "$RUNNER_TEMP/stats-one.json"
          go run ./cmd/gen-type-go stats --summary testdata/stats_forest.json > "$RUNNER_TEMP/stats-summary.txt"
          grep -q 'Roots: 3' "$RUNNER_TEMP/stats-summary.txt"
          if go run ./cmd/gen-type-go stats testdata/invalid_cycle.json > "$RUNNER_TEMP/stats-invalid.json"; then
            echo 'invalid graph unexpectedly measured' >&2; exit 1
          fi
          test ! -s "$RUNNER_TEMP/stats-invalid.json"
          # New v0.4 read-only commands.
          go run ./cmd/gen-type-go inspect --id c testdata/stats_forest.json > "$RUNNER_TEMP/inspect-one.json"
          go run ./cmd/gen-type-go inspect --id c testdata/stats_forest.json > "$RUNNER_TEMP/inspect-two.json"
          cmp "$RUNNER_TEMP/inspect-one.json" "$RUNNER_TEMP/inspect-two.json"
          grep -q '"schema":"gen-type-go/graph-inspection-v0"' "$RUNNER_TEMP/inspect-one.json"
          grep -q '"ancestors":\["r1","a"\]' "$RUNNER_TEMP/inspect-one.json"
          go run ./cmd/gen-type-go diagnose testdata/tiny_graph.json > "$RUNNER_TEMP/diag-valid.json"
          grep -q '"valid":true' "$RUNNER_TEMP/diag-valid.json"
          if go run ./cmd/gen-type-go diagnose testdata/invalid_duplicate_id.json > "$RUNNER_TEMP/diag-invalid.json"; then
            echo 'malformed graph unexpectedly accepted' >&2; exit 1
          fi
          grep -q '"valid":false' "$RUNNER_TEMP/diag-invalid.json"
          if go run ./cmd/gen-type-go inspect --id missing testdata/tiny_graph.json > "$RUNNER_TEMP/inspect-missing.json"; then
            echo 'unknown node unexpectedly inspected' >&2; exit 1
          fi
          test ! -s "$RUNNER_TEMP/inspect-missing.json"
