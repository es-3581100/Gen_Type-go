name: Temporary PR6 source export for independent local replay
on:
  push:
    branches: [audit/pr6-independent-source-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f8c6ba9461c01d165313a6bb8b1076d1cea2d576
          persist-credentials: false
      - name: Archive reviewed tree (not workflow branch tree)
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "f8c6ba9461c01d165313a6bb8b1076d1cea2d576"
          git archive --format=tar HEAD | gzip -n -9 > pr6-source-exact-head.tar.gz
          sha256sum pr6-source-exact-head.tar.gz | tee source_archive.sha256
          printf '%s\n' f8c6ba9461c01d165313a6bb8b1076d1cea2d576 > source_commit.txt
      - name: Upload exact tree for independent replay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen-type-go-pr6-exact-source
          path: |
            pr6-source-exact-head.tar.gz
            source_archive.sha256
            source_commit.txt
          if-no-files-found: error
          retention-days: 1
