name: Temporary pinned main source snapshot
on:
  push:
    branches:
      - audit/pr6-independent-source-export
permissions:
  contents: read
jobs:
  pinned-main-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7b071c7c0ed5037b107f4ae9a263f3c06853c46f
          fetch-depth: 1
      - name: Verify exact main revision and export
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7b071c7c0ed5037b107f4ae9a263f3c06853c46f"
          git archive --format=tar.gz --output=main-exact-source.tar.gz HEAD
          printf '%s\n' "7b071c7c0ed5037b107f4ae9a263f3c06853c46f" > main-source-commit.txt
          sha256sum main-exact-source.tar.gz > main-source-archive.sha256
          git rev-parse HEAD^{tree} > main-source-tree.txt
      - name: Upload source snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen-type-go-main-7b071c7c0ed5
          path: |
            main-exact-source.tar.gz
            main-source-commit.txt
            main-source-tree.txt
            main-source-archive.sha256
          retention-days: 1
